[package]
name = "filmcraft-platform"
description = "OS media integration: hardware video decoding through the operating system's codecs (VideoToolbox on macOS), with transparent fallback to the pure-Rust decoders"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The one crate allowed to contain `unsafe` (OS media FFI; AGENTS.md §0.3, docs/adr/0001-platform-ffi.md).
# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: only the FFI modules
# opt in with `#[allow(unsafe_code)]`, and every `unsafe` block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
filmcraft-bitstream = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-isobmff = { workspace = true }
# Our own parsers: the VA-API picture-parameter records are built from the slice headers and
# parameter sets these decode, so the backend and the software decoders read one description of a
# stream. Only the codecs the backend actually reads are listed.
filmcraft-h264 = { workspace = true }
filmcraft-hevc = { workspace = true }
# VP9: unlike the two above, a VP9 record is built from the *frame's own* uncompressed header
# rather than from a parameter set, and libva wants that header as
# `VADecPictureParameterBufferVP9`. `filmcraft-vp9` is our bit-exact VP9 parser, so the record is
# derived from the same parse the software decoder runs rather than guessed; only the header
# module (`filmcraft_vp9::header`) is used — not the pixel decoder, which the fallback already has.
filmcraft-vp9 = { workspace = true }
# AV1, for the same reason as VP9 and one step further: an AV1 picture-parameter record is built
# from the *frame's own* uncompressed header, which `filmcraft-av1` parses from the AV1 Bitstream &
# Decoding Process Specification v1.0.0 with Errata 1. Only `filmcraft_av1::header` (and the
# `BitReader` it reads through) is used — not the pixel decoder, which the fallback already has.
filmcraft-av1 = { workspace = true }
filmcraft-time = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

# Windows: Media Foundation decoder MFTs + Direct3D 11 / DXVA through the official `windows` bindings
# (MIT OR Apache-2.0; already in the lockfile through wgpu / winit).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
